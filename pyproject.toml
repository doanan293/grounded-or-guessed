[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "flx"
version = "0.1.0"
description = "Experiments for the 2KH SemLoc study (IT5440, HUST)"
requires-python = ">=3.10"
dependencies = ["openai>=1.0", "scipy>=1.11", "matplotlib>=3.8"]

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
norecursedirs = ["fixtures"]
markers = ["slow: compiles LaTeX or other long builds (run with -m slow)"]
addopts = "-m 'not slow'"
