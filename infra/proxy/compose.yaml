# LLM gateway for the 2KH experiments: cli-proxy-api, an OpenAI-compatible proxy over the
# OAuth logins kept in the vipharmind_cli_proxy_auth volume (Antigravity/Gemini, Claude, Codex).
# Reuses vipharmind's config file read-only; nothing in the vipharmind repo is modified.
#   docker compose -f infra/proxy/compose.yaml up -d
name: flx-proxy

services:
  cli-proxy-api:
    image: eceasy/cli-proxy-api:v8.0.28
    ports:
      - "${CLI_PROXY_API_PORT:-8317}:8317"
    environment:
      TZ: "Asia/Ho_Chi_Minh"
    volumes:
      - /home/andv/personal/vipharmind/devops/cli-proxy-api/config.yaml:/CLIProxyAPI/config.yaml:ro
      - cli_proxy_auth:/root/.cli-proxy-api
    healthcheck:
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/8317 && printf 'GET /healthz HTTP/1.0\\r\\n\\r\\n' >&3 && grep -q ' 200 ' <&3"]
      interval: 15s
      timeout: 5s
      retries: 5
    restart: unless-stopped

volumes:
  cli_proxy_auth:
    external: true
    name: vipharmind_cli_proxy_auth
